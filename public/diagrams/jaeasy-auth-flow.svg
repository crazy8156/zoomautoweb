<svg width="1600" height="1400" viewBox="0 0 1600 1400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="1400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FBFF"/>
      <stop offset="1" stop-color="#E0EEFF"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F7FAFF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M1 1L11 6L1 11V1Z" fill="#2563EB"/>
    </marker>
    <style>
      text {
        font-family: "Microsoft JhengHei", "Noto Sans TC", sans-serif;
        fill: #0F172A;
      }
      .title {
        font-size: 38px;
        font-weight: 800;
      }
      .subtitle {
        font-size: 18px;
        font-weight: 500;
        fill: #475569;
      }
      .label {
        font-size: 20px;
        font-weight: 700;
      }
      .small {
        font-size: 17px;
        font-weight: 500;
        fill: #334155;
      }
      .decision {
        font-size: 20px;
        font-weight: 800;
      }
      .tag {
        font-size: 15px;
        font-weight: 700;
      }
    </style>
  </defs>

  <rect width="1600" height="1400" rx="36" fill="url(#bg)"/>

  <text x="800" y="78" text-anchor="middle" class="title">Jaeasy 註冊與登入網址流程圖</text>
  <text x="800" y="112" text-anchor="middle" class="subtitle">目前線上網址：/jaeasy/login → 自動分流到註冊、登入或忘記密碼</text>

  <g filter="url(#shadow)">
    <rect x="580" y="150" width="440" height="92" rx="28" fill="url(#card)" stroke="#BFDBFE" stroke-width="2"/>
    <text x="800" y="188" text-anchor="middle" class="label">1. 進入智慧入口</text>
    <text x="800" y="218" text-anchor="middle" class="small">/jaeasy/login</text>
  </g>

  <path d="M800 242V290" stroke="#2563EB" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="510" y="300" width="580" height="116" rx="28" fill="url(#card)" stroke="#BFDBFE" stroke-width="2"/>
    <text x="800" y="340" text-anchor="middle" class="label">2. 使用者輸入 Email + 密碼</text>
    <text x="800" y="372" text-anchor="middle" class="small">送出單一表單，系統先查這個 Email 是否已有 Jaeasy 帳號</text>
  </g>

  <path d="M800 416V486" stroke="#2563EB" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <polygon points="800,500 1020,640 800,780 580,640" fill="#EFF6FF" stroke="#60A5FA" stroke-width="3"/>
    <text x="800" y="628" text-anchor="middle" class="decision">3. students.source='jaeasy'</text>
    <text x="800" y="660" text-anchor="middle" class="decision">是否已有這個 Email？</text>
  </g>

  <text x="1120" y="586" class="tag" fill="#2563EB">沒有帳號</text>
  <text x="340" y="586" class="tag" fill="#2563EB">已有帳號</text>

  <path d="M1020 640H1220V250H1095" stroke="#2563EB" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <path d="M580 640H340V820H505" stroke="#2563EB" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="1080" y="170" width="400" height="146" rx="28" fill="url(#card)" stroke="#86EFAC" stroke-width="2"/>
    <text x="1280" y="214" text-anchor="middle" class="label">4A. 自動切到註冊畫面</text>
    <text x="1280" y="248" text-anchor="middle" class="small">/jaeasy/login?mode=register&amp;email=...</text>
    <text x="1280" y="278" text-anchor="middle" class="small">顯示姓名、Email、密碼欄位</text>
  </g>

  <path d="M1280 316V390" stroke="#16A34A" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="1080" y="404" width="400" height="168" rx="28" fill="url(#card)" stroke="#86EFAC" stroke-width="2"/>
    <text x="1280" y="448" text-anchor="middle" class="label">5A. 完成註冊</text>
    <text x="1280" y="482" text-anchor="middle" class="small">建立 Supabase Auth 帳號</text>
    <text x="1280" y="512" text-anchor="middle" class="small">同步寫入 profiles / students</text>
    <text x="1280" y="542" text-anchor="middle" class="small">建立 jaeasy_session cookie</text>
  </g>

  <path d="M1280 572V640H1030" stroke="#16A34A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="80" y="740" width="420" height="162" rx="28" fill="url(#card)" stroke="#FCD34D" stroke-width="2"/>
    <text x="290" y="784" text-anchor="middle" class="label">4B. 直接登入模式</text>
    <text x="290" y="818" text-anchor="middle" class="small">/jaeasy/login?mode=login&amp;email=...</text>
    <text x="290" y="848" text-anchor="middle" class="small">同一個 Email 直接驗證密碼</text>
  </g>

  <path d="M290 902V980" stroke="#D97706" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <polygon points="290,994 495,1124 290,1254 85,1124" fill="#FFFBEB" stroke="#F59E0B" stroke-width="3"/>
    <text x="290" y="1114" text-anchor="middle" class="decision">5B. 密碼正確嗎？</text>
    <text x="420" y="1040" class="tag" fill="#D97706">正確</text>
    <text x="470" y="1188" class="tag" fill="#D97706">錯誤</text>
  </g>

  <path d="M495 1124H690V1110H815" stroke="#D97706" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <path d="M290 1254V1310H1080V1110H995" stroke="#D97706" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="820" y="1028" width="410" height="164" rx="28" fill="url(#card)" stroke="#93C5FD" stroke-width="2"/>
    <text x="1025" y="1072" text-anchor="middle" class="label">6. 登入成功</text>
    <text x="1025" y="1106" text-anchor="middle" class="small">建立 jaeasy_session cookie</text>
    <text x="1025" y="1136" text-anchor="middle" class="small">導向 /jaeasy</text>
    <text x="1025" y="1166" text-anchor="middle" class="small">進入自學中心首頁</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1080" y="760" width="420" height="188" rx="28" fill="url(#card)" stroke="#FCA5A5" stroke-width="2"/>
    <text x="1290" y="804" text-anchor="middle" class="label">6B. 第一次登入失敗</text>
    <text x="1290" y="838" text-anchor="middle" class="small">自動切到忘記密碼模式</text>
    <text x="1290" y="868" text-anchor="middle" class="small">/jaeasy/login?mode=forgot&amp;email=...&amp;showForgot=1</text>
    <text x="1290" y="898" text-anchor="middle" class="small">同頁直接顯示重設密碼表單</text>
  </g>

  <path d="M1290 948V1010" stroke="#DC2626" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="1180" y="1028" width="320" height="164" rx="28" fill="url(#card)" stroke="#FCA5A5" stroke-width="2"/>
    <text x="1340" y="1072" text-anchor="middle" class="label">7. 忘記密碼</text>
    <text x="1340" y="1106" text-anchor="middle" class="small">送出 Email</text>
    <text x="1340" y="1136" text-anchor="middle" class="small">Supabase 寄出重設信</text>
    <text x="1340" y="1166" text-anchor="middle" class="small">信內連到 /jaeasy/reset-password</text>
  </g>

  <rect x="110" y="1270" width="1380" height="78" rx="22" fill="#0F172A" fill-opacity="0.92"/>
  <text x="800" y="1316" text-anchor="middle" class="small" fill="#F8FAFC">
    目前核心邏輯：先用單一入口判斷帳號是否存在，再分流到註冊或登入；登入第一次錯誤則直接帶出忘記密碼。
  </text>
</svg>
